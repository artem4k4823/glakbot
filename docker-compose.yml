services:
  db:
    image: postgres:16-alpine
    container_name: snaphelp_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: snaphelp_db
    ports:
      - "5437:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d snaphelp_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: snaphelp_dashboard
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DASHBOARD_HOST=0.0.0.0
      - DASHBOARD_DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/snaphelp_db
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/snaphelp_db
      - CLIENT_ID=${CLIENT_ID}
      - CLIENT_SECRET=${CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI}
      - BOT_TOKEN=${BOT_TOKEN}
    volumes:
      - ./dashboard:/app/dashboard
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: snaphelp_bot
    restart: always
    environment:
      - BOT_TOKEN=${BOT_TOKEN}
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@db:5432/snaphelp_db
    depends_on:
      db:
        condition: service_healthy
      dashboard:
        condition: service_started

volumes:
  postgres_data:
