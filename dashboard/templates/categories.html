{% extends "base.html" %}

{% block content %}
<div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
  <h2 style="font-size: 1.25rem; font-weight: 600;">Управление категориями тикетов</h2>
  <button class="btn btn-primary" onclick="openModal('addCategoryModal')">
    <i class="fa-solid fa-plus"></i> Добавить категорию
  </button>
</div>

<div class="table-container">
  <table>
    <thead>
      <tr>
        <th>Эмодзи</th>
        <th>Название</th>
        <th>Описание</th>
        <th>ID</th>
        <th>Действия</th>
      </tr>
    </thead>
    <tbody>
      {% for category in categories %}
      <tr>
        <td style="font-size: 1.5rem;">{{ category.emoji }}</td>
        <td><strong>{{ category.label }}</strong></td>
        <td style="color: var(--text-muted);">{{ category.description }}</td>
        <td><code>{{ category.id }}</code></td>
        <td>
          <button class="btn btn-danger" style="padding: 0.3rem 0.6rem; font-size: 0.75rem;" onclick="deleteCategory('{{ category.id }}')">
            <i class="fa-solid fa-trash"></i> Удалить
          </button>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<!-- Modal Add Category -->
<div class="modal-backdrop" id="addCategoryModal">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-title">Новая категория</h3>
      <button class="close-btn" onclick="closeModal('addCategoryModal')">&times;</button>
    </div>
    <form onsubmit="handleCreateCategory(event)">
      <div class="form-group">
        <label class="form-label">Эмодзи</label>
        <input type="text" id="categoryEmoji" class="form-control" placeholder="например 🛠️ или 💳" required>
      </div>

      <div class="form-group">
        <label class="form-label">Название категории</label>
        <input type="text" id="categoryLabel" class="form-control" placeholder="например Поддержка" required>
      </div>

      <div class="form-group">
        <label class="form-label">Описание</label>
        <input type="text" id="categoryDesc" class="form-control" placeholder="Краткое пояснение категории">
      </div>

      <div style="display: flex; justify-content: flex-end; gap: 0.75rem; margin-top: 1.5rem;">
        <button type="button" class="btn" style="background: rgba(255,255,255,0.05);" onclick="closeModal('addCategoryModal')">Отмена</button>
        <button type="submit" class="btn btn-primary">Создать</button>
      </div>
    </form>
  </div>
</div>
{% endblock %}
