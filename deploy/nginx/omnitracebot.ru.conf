# /etc/nginx/sites-available/omnitracebot.ru
# Это HTTP-конфиг. Блоки для HTTPS (443) и редирект с http на https
# certbot допишет сам командой:
#   certbot --nginx -d omnitracebot.ru -d www.omnitracebot.ru --redirect

server {
    listen 80;
    listen [::]:80;
    server_name omnitracebot.ru www.omnitracebot.ru;

    client_max_body_size 10m;

    # Статику отдаём с кешем
    location /static/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        expires 7d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
